<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Send a birthday wish to Bonheur.">
	<title>Happy Birthday, Bonheur</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<div class="body-bg" aria-hidden="true"></div>

	<main class="container" style="background-image: url('./image/image1.jpg');">
		<div class="container-data">
			<p class="eyebrow">A little celebration from BonTech</p>
			<h1 id="msg" aria-live="polite">Happy Birthday, Bonheur</h1>
			<p class="intro">Leave a warm message and add a little more joy to the celebration.</p>

			<form class="wish-form" id="wish-form">
				<label for="wish-input">Your birthday wish</label>
				<div class="form-row">
					<input id="wish-input" name="wish" type="text" maxlength="140" placeholder="Write something lovely..." autocomplete="off" required>
					<button type="submit">Send wish <span aria-hidden="true">&#8594;</span></button>
				</div>
				<p class="form-status" id="form-status" role="status"></p>
			</form>

			<section class="wishes" aria-labelledby="wishes-title">
				<div class="section-heading">
					<h2 id="wishes-title">Birthday wishes</h2>
					<span id="wish-count">0</span>
				</div>
				<ul class="wish-list" id="wish-list"></ul>
			</section>
		</div>
	</main>

	<footer class="float" id="float">Bonheur@BonTech</footer>

	<script src="script.js"></script>
</body>

</html>
